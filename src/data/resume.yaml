          - 'N+1 회피 — 거래 목록 페이지의 거래 id로 회고를 일괄 조회해 질의 3개로 응답. size 100 초과는 400 대신 100으로 절삭'
          - 'Web Push(VAPID) — AES128GCM 암호화와 JDK HttpClient 전송. 트랜잭션 커밋 이후에만 발송하고, 스케줄을 사용자 1건 단위 트랜잭션으로 나눠 한 사람의 실패가 나머지를 막지 않게 함'
          - 'pgvector 스키마 — CREATE EXTENSION에 스키마를 명시하지 않으면 search_path 순서에 따라 설치 위치가 달라지는 문제를 짚고 고정'
          - '세션 복원 · open redirect 방어 — GET /users/me까지 마쳐야 복원으로 판정하고, 딥링크 redirect를 URL 파서로 같은 출처인지 검증(/\evil.example 형태 포함)'
