name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 서식 검사
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm type-check

      - name: 단위 테스트
        run: pnpm test

      - name: 프로덕션 빌드
        run: pnpm build

      # 계정에 올리지 않고 wrangler 설정과 정적 자산 경로만 검증한다.
      - name: 배포 설정 검사
        run: pnpm exec wrangler deploy --dry-run
