# pnpm은 허용한 패키지의 설치 스크립트만 실행한다.
allowBuilds:
  # Vite가 쓰는 esbuild 바이너리를 설치 시점에 검증한다.
  esbuild: true
  # Astro 이미지 최적화와 wrangler(miniflare)가 쓰는 네이티브 모듈이다.
  sharp: true
  # wrangler dev가 로컬에서 Workers 런타임을 띄울 때 쓰는 바이너리를 내려받는다.
  workerd: true

overrides:
  # satori 0.33이 쓰는 @shuding/opentype.js는 fflate 0.7.3에 묶여 있다.
  # GHSA-px8p-9vwx-vf98(ZIP64 무한 루프)는 0.7.5에서 고쳐졌다. satori 0.63으로 올리면 지운다.
  fflate@<0.7.5: 0.7.5
